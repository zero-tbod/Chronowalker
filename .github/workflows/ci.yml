name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\Chronowalker.slnx
      - name: Build x64 app
        run: dotnet build .\Chronowalker.csproj -c Release -p:Platform=x64 --no-restore
      - name: Run core tests
        run: dotnet test .\Chronowalker.Core.Tests\Chronowalker.Core.Tests.csproj -c Release --no-restore
